[project]
name = "deep-search-stack"
version = "0.1.0"
description = "Deep search for Claude Code: Tavily+Jina and self-hosted SearXNG+Crawl4AI in parallel, merged into one report"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=1.0",
    "defusedxml>=0.7.1",
    "trafilatura>=2.0",
    "patchright>=1.64.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["lib", "skills/deep-search/scripts"]
testpaths = ["tests"]
